<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get SportsGuy</title>

    <!-- WHY THIS PAGE EXISTS. A share has to do two things at once: unfurl into the branded card,
         and land the person on TestFlight. A raw testflight.apple.com link does the second and
         throws away the first - it unfurls as Apple's own grey card. So the app shares THIS, the
         card comes from these tags, and the page hands them straight on. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sportsguy.xyz/get">
    <meta property="og:title" content="SportsGuy">
    <meta property="og:description" content="Know what's going on in sports. One line a day.">
    <meta property="og:image" content="https://sportsguy.xyz/icons/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SportsGuy">
    <meta name="twitter:description" content="Know what's going on in sports. One line a day.">
    <meta name="twitter:image" content="https://sportsguy.xyz/icons/share-card.png">

    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #F9F8F5;
             font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #714E4E; }
      @media (prefers-color-scheme: dark) { body { background: #141110; color: #EFE6E0; } }
      main { text-align: center; padding: 24px; max-width: 420px; }
      img { width: 100%; max-width: 380px; height: auto; border-radius: 18px; }
      h1 { font-size: 20px; margin: 22px 0 6px; }
      p { font-size: 15px; line-height: 1.5; opacity: 0.75; margin: 0 0 22px; }
      a.go { display: inline-block; background: #0665FF; color: #fff; text-decoration: none;
             font-weight: 600; font-size: 17px; padding: 14px 26px; border-radius: 26px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/share-card.png" alt="Sound like a SportsGuy.">
      <h1 id="head">Opening TestFlight…</h1>
      <p id="why">SportsGuy is in beta. TestFlight is Apple's app for trying it out.</p>
      <a class="go" id="go" href="https://sportsguy.xyz">Get SportsGuy</a>
    </main>

    <script>
      var TESTFLIGHT = 'https://testflight.apple.com/join/hDGJhjs2';

      // TestFlight is an iPhone app, so it is only worth sending an iPhone there. Everyone else -
      // a laptop, an Android, a link preview crawler - gets the thing they can actually use.
      var go = document.getElementById('go');
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (iOS && TESTFLIGHT) {
        go.href = TESTFLIGHT;
        go.textContent = 'Open TestFlight';
        location.replace(TESTFLIGHT);
      } else {
        document.getElementById('head').textContent = 'Sound like a SportsGuy.';
        document.getElementById('why').textContent = 'The iPhone beta is on TestFlight. On anything else, it runs in the browser.';
        go.href = 'https://sportsguy.xyz/app';
        go.textContent = 'Try it here';
      }
    </script>
  </body>
</html>
