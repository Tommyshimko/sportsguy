      (function () {
        var box = document.getElementById('sg-boot'), bar = document.getElementById('sg-bar'), line = document.getElementById('sg-line');

        var at = Math.floor(Math.random() * LINES.length), shown = 0, real = 0, over = false;
        line.textContent = LINES[at];
