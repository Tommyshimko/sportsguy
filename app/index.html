    <!-- Paint the right ground before any JavaScript runs, or a dark-mode visit flashes cream first.
         Same rule the app uses: a saved choice wins, otherwise the browser's own. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('sg-theme');
          var dark = c === 'dark' || ((!c || c === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.background = dark ? '#141110' : '#F9F8F5';
          document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
